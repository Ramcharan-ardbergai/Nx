name: Coznt - create Nx project
run-name: "Coznt Nx: ${{ inputs.project_name }} (${{ inputs.branch }})"
on:
  workflow_dispatch:
    inputs:
      project_name: { required: true, type: string }
      template: { required: true, type: string }
      branch: { required: true, type: string }
      coznt_project_id: { required: true, type: string }
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # Nx generators can invoke npm internally. Use npm's stable peer resolver
      # to avoid Arborist crashing with "Cannot read properties of null (edgesOut)".
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install workspace dependencies
        shell: bash
        run: |
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then yarn install --immutable
          elif [[ -f package-lock.json ]]; then npm ci
          else echo 'A supported lockfile is required.' >&2; exit 2
          fi
      - name: Select branch
        env:
          REQUESTED_BRANCH: "${{ inputs.branch }}"
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
        run: |
          if git fetch origin "$REQUESTED_BRANCH"; then
            BASE_BRANCH="$REQUESTED_BRANCH"
            BRANCH="coznt/nx-${{ inputs.project_name }}-${{ github.run_id }}"
          else
            BASE_BRANCH="$DEFAULT_BRANCH"
            BRANCH="$REQUESTED_BRANCH"
            git fetch origin "$BASE_BRANCH"
          fi
          git switch -c "$BRANCH" "origin/$BASE_BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "BASE_BRANCH=$BASE_BRANCH" >> "$GITHUB_ENV"
      - name: Generate application with Nx
        env:
          NAME: "${{ inputs.project_name }}"
          TEMPLATE: "${{ inputs.template }}"
          NX_IGNORE_UNSUPPORTED_TS_SETUP: "true"
        shell: bash
        run: |
          case "$TEMPLATE" in
            angular) PLUGIN='@nx/angular'; GENERATOR='@nx/angular:application' ;;
            next) PLUGIN='@nx/next'; GENERATOR='@nx/next:application' ;;
            node) PLUGIN='@nx/node'; GENERATOR='@nx/node:application' ;;
            *) echo "Unsupported template: $TEMPLATE" >&2; exit 2 ;;
          esac
          node -e "require.resolve('$PLUGIN/package.json')" >/dev/null 2>&1 || npx nx add "$PLUGIN" --no-interactive
          npx nx generate "$GENERATOR" "apps/$NAME" --e2eTestRunner=none --no-interactive
      - name: Make CI independent of Nx Cloud
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = '.github/workflows';
          if (!fs.existsSync(directory)) process.exit(0);
          for (const name of fs.readdirSync(directory)) {
            if (!/.ya?ml$/i.test(name) || name === 'coznt-nx-create-project.yml') continue;
            const file = path.join(directory, name);
            const original = fs.readFileSync(file, 'utf8');
            const updated = original
              .replace(/npx nx records+--s+/g, '')
              .replace(/remotes/origin/[A-Za-z0-9._/-]+/g, 'HEAD~1');
            if (updated !== original) fs.writeFileSync(file, updated);
          }
          NODE
      - name: Commit and push
        env:
          NAME: "${{ inputs.project_name }}"
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: scaffold $NAME with Nx"
          git push --set-upstream origin "$BRANCH"
      - name: Open pull request
        env:
          GH_TOKEN: "${{ github.token }}"
          NAME: "${{ inputs.project_name }}"
        run: |
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --head "$BRANCH" --base "$BASE_BRANCH" --title "feat: scaffold $NAME with Nx" --body "Generated by Coznt in GitHub Actions."
